<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tubitle 学习侧边栏</title>
    <style>
      :root{font-family:Inter,system-ui,-apple-system,"PingFang SC",sans-serif;background:#111219;color:#eceef5;color-scheme:dark}*{box-sizing:border-box}body{margin:0}.sidepanel-shell{min-height:100vh}.side-tabs{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:7px 8px;background:rgba(17,18,25,.96);border-bottom:1px solid #292c38;backdrop-filter:blur(12px)}.side-tab{position:relative;border:0;border-radius:8px;padding:9px 10px;background:transparent;color:#9297a7;font:inherit;font-size:14px;font-weight:650;cursor:pointer}.side-tab:hover{background:#20222d;color:#e6e7ed}.side-tab.active{background:#2a2442;color:#bdaeff}.side-tab.active::after{content:"";position:absolute;left:22%;right:22%;bottom:2px;height:2px;border-radius:2px;background:#8d70ff}.side-tab:focus-visible{outline:2px solid #a999ff;outline-offset:1px}.page{padding:18px 16px 40px}.page.definition-page{padding:0}.brand{font-size:13px;color:#8f94a5}.word{margin:7px 0 16px;font-size:28px;line-height:1.2;color:#ffe58f}.status{padding:14px;border:1px solid #2d3040;border-radius:12px;background:#181a23;color:#aeb2c0;line-height:1.6}.audio-error{padding:9px 14px;background:#542329;color:#ffd4d4;font-size:13px;line-height:1.45}.definition{display:block;width:100%;min-width:0;height:120px;overflow:hidden;border:0}.definition-page .suggestions{margin:20px 16px 0}.suggestions{margin-top:20px;padding-top:14px;border-top:1px solid #292c38}.suggestions button{margin:4px 5px 4px 0;border:1px solid #393c4b;border-radius:8px;padding:6px 9px;background:#1b1d27;color:#d9dbe5;cursor:pointer}.suggestions button:hover{background:#7c5cff}.error{color:#ffb8b8}.empty{color:#989caa}.analysis-page{min-height:calc(100vh - 51px);padding:18px 16px 36px;background:linear-gradient(180deg,#151720,#101117)}.analysis-header,.history-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.analysis-header h1,.history-header h1{margin:3px 0 0;font-size:23px;color:#ffe58f}.analysis-header button,.history-header button{flex:none;border:1px solid #464a5b;border-radius:8px;padding:7px 10px;background:#242735;color:#e9eaf0;cursor:pointer}.analysis-header button:hover,.history-header button:hover{background:#7357eb}.analysis-original,.analysis-output{border:1px solid #2e3240;border-radius:12px;background:#191b24}.analysis-original{padding:13px 14px;margin-bottom:12px}.analysis-original p{margin:5px 0 0;color:#f0f1f5;line-height:1.55}.analysis-label{color:#a999ff;font-size:12px;font-weight:750}.analysis-output{min-height:180px;padding:15px 14px;color:#dedfe5;font-size:14px;line-height:1.72}.analysis-line{min-height:1.72em;white-space:pre-wrap}.analysis-line.heading{margin-top:12px}.analysis-line.heading:first-child{margin-top:0}.analysis-line.heading strong{display:inline-block;min-width:46px;color:#a999ff}.analysis-line.heading span{color:#f0f1f5}.analysis-waiting{color:#8f94a5}.typewriter-cursor{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-2px;background:#ffe58f;animation:blink .75s steps(1) infinite}.analysis-stream-error{margin-top:10px;border-radius:8px;padding:9px 11px;background:#542329;color:#ffd4d4;font-size:13px}.analysis-progress{margin-top:10px;color:#8f94a5;font-size:12px}.analysis-progress.done{color:#70d7a6}.analysis-progress.error{color:#ffaaaa}.history-page{min-height:calc(100vh - 51px);padding:18px 12px 36px;background:linear-gradient(180deg,#151720,#101117)}.history-header{padding:0 4px}.history-list{display:flex;flex-direction:column;gap:8px}.history-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px;width:100%;border:1px solid #2d3040;border-radius:11px;padding:11px 10px;background:#191b24;color:#eceef5;text-align:left;cursor:pointer}.history-item:hover{border-color:#6753bd;background:#20222d}.history-kind{margin-top:1px;border-radius:5px;padding:3px 6px;background:#2b2445;color:#bcaeff;font-size:11px;white-space:nowrap}.history-kind.dictionary{background:#173b35;color:#79d7be}.history-content{display:flex;min-width:0;flex-direction:column;gap:4px}.history-content strong{overflow:hidden;color:#f1f1f5;font-size:14px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}.history-content small{display:-webkit-box;overflow:hidden;color:#8f94a5;font-size:12px;font-weight:400;line-height:1.45;-webkit-box-orient:vertical;-webkit-line-clamp:2}.history-item time{padding-top:3px;color:#737888;font-size:11px;white-space:nowrap}@keyframes blink{50%{opacity:0}}
    </style>
  </head>
  <body><div id="root"></div><script src="sidepanel.js"></script></body>
</html>
