<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Tubitle icon</title>
  <desc id="desc">A play symbol above two bilingual subtitle lines on a violet rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="18" y1="10" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B82FF"/>
      <stop offset="0.48" stop-color="#7252F2"/>
      <stop offset="1" stop-color="#35247D"/>
    </linearGradient>
    <linearGradient id="shine" x1="32" y1="8" x2="83" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B103F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#171227"/>
  <rect x="4" y="4" width="120" height="120" rx="25" fill="url(#background)"/>
