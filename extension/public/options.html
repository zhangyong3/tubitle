<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tubitle 设置</title>
    <style>
      :root{font-family:Inter,system-ui,-apple-system,"PingFang SC",sans-serif;background:#0f1016;color:#f7f7fb;color-scheme:dark}*{box-sizing:border-box}body{margin:0}.page{max-width:820px;margin:0 auto;padding:54px 24px 80px}h1{font-size:34px;margin:0 0 8px}.lead{color:#a5a8b5;margin-bottom:34px}.card{background:#171922;border:1px solid #282b37;border-radius:18px;padding:24px;margin:18px 0}.card h2{font-size:18px;margin:0 0 20px}.card h3{font-size:14px;margin:26px 0 14px;color:#d8d9e2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;color:#c8cad3}input:not([type=checkbox]),select{width:100%;border:1px solid #353847;border-radius:10px;background:#101119;color:#fff;padding:11px 12px;outline:none}input[type=checkbox]{accent-color:#7c5cff;margin-right:7px}input[type=range]{padding:0;border:0;background:transparent;accent-color:#7c5cff}input[type=color]{height:44px;padding:4px}input:focus,select:focus{border-color:#8065ff}.hint{font-size:12px;color:#858999;line-height:1.5}.actions{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}button{border:0;border-radius:10px;background:#7c5cff;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}button.secondary{background:#292c38;color:#d9dbe4}button:disabled{opacity:.55;cursor:not-allowed}.saved{color:#7ee2a8;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
    </style>
  </head>
  <body><div id="root"></div><script src="options.js"></script></body>
</html>
