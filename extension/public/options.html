<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tubitle 设置</title>
    <style>
      :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#1e1e1e;color:#d8d8d8;color-scheme:dark;font-size:14px;line-height:1.6;--accent:#a78bfa;--muted:#999}
      *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}[hidden]{display:none!important}
      .settings-shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
      .sidebar{overflow-y:auto;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:28px 16px 22px;border-right:1px solid #414141;background:#202020}
      .brand{display:flex;align-items:center;gap:10px;padding:0 12px;margin-bottom:26px;font-size:16px;font-weight:650}.brand-mark{display:block;flex-shrink:0;border-radius:6px}.brand-label{margin-left:5px;color:#aaa;font-weight:500}
      nav{display:flex;flex-direction:column;gap:3px}.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:7px 11px;background:transparent;color:#c6c6c6;border:0;border-radius:6px;font-weight:500;text-align:left;line-height:1.6}.nav-item svg{flex-shrink:0}.nav-item:hover{background:#303030}.nav-item.is-active{background:#454545;color:#fff}.chevron{margin-left:auto;color:#aaa}.nav-children{display:flex;flex-direction:column;gap:2px;margin:5px 12px 9px 19px;padding-left:18px;border-left:1px solid #444}.nav-children a{display:block;padding:5px 10px;color:#aaa;text-decoration:none;border-radius:5px;font-size:13px}.nav-children a:hover{background:#303030;color:#eee}
      .sidebar-footer{margin-top:auto;padding:28px 12px 0;color:#aaa;font-size:12px}.sidebar-footer span{display:block;color:#747474;margin-top:3px}
      .page{width:100%;max-width:1040px;padding:38px 62px 72px}.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}h1{font-size:25px;line-height:1.4;font-weight:650;margin:0 0 8px;letter-spacing:.02em}.lead{font-size:13px;color:var(--muted);margin:0}.save-status{flex-shrink:0;font-size:12px;color:#aaa;padding-top:8px;display:flex;align-items:center;gap:8px}.save-status:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}.save-status.is-error{color:#f5aaa4}.save-status.is-error:before{background:#f5aaa4}.retry-save{padding:2px 8px;font-size:12px}
      .card{background:#242424;border-radius:10px;padding:24px;margin:0 0 18px;min-width:0}.card h2{font-size:16px;line-height:1.5;font-weight:600;margin:0 0 20px;scroll-margin-top:24px}.card h3{font-size:14px;margin:24px 0 14px;color:#ccc}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px}.field{display:flex;flex-direction:column;gap:8px;min-width:0}.field.full{grid-column:1/-1}label{font-size:13px;color:#ccc}input:not([type=checkbox]):not([type=file]),select{width:100%;min-width:0;border:1px solid #474747;border-radius:7px;background:#333;color:#eee;padding:8px 10px;outline:none}input[type=checkbox]{accent-color:var(--accent);margin:0 7px 0 0;vertical-align:-2px;width:15px;height:15px}input[type=range]{padding:0!important;border:0!important;background:transparent!important;accent-color:var(--accent);height:34px}input[type=color]{height:40px;padding:4px!important}
      input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}fieldset{border:0;border-top:1px solid #303030;margin:24px 0 0;padding:18px 0 0;min-width:0}legend{padding:0 10px 0 0;color:#ccc;font-size:13px}.hint{font-size:12px;color:var(--muted);line-height:1.7;overflow-wrap:anywhere}p.hint{margin:14px 0 0}.actions{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}button{border:1px solid #4b4b4b;border-radius:7px;background:#3b3b3b;color:#eee;padding:7px 13px;font-weight:500;cursor:pointer;transition:background-color .12s,transform .12s}button:hover{background:#484848}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:not-allowed}.loading{padding:48px;color:var(--muted)}
      @media(min-width:1400px){.page{margin-left:28px}}@media(max-width:1000px){.settings-shell{grid-template-columns:220px minmax(0,1fr)}.page{padding:32px 28px 60px}.page-header{flex-direction:column;gap:5px}.save-status{padding-top:0}}@media(max-width:640px){.settings-shell{grid-template-columns:156px minmax(0,1fr)}.sidebar{padding:22px 8px}.brand{padding:0 7px;gap:7px;font-size:14px;flex-wrap:wrap}.brand-label{margin-left:0}.nav-item{padding:7px 8px;gap:7px;font-size:13px}.nav-children{margin-left:15px;padding-left:7px}.nav-children a{padding:5px;font-size:12px}.page{padding:24px 16px 48px}h1{font-size:22px}.card{padding:18px 15px}.grid{grid-template-columns:1fr;gap:18px}.field.full{grid-column:auto}.sidebar-footer{padding-left:7px}.page-header{margin-bottom:20px}}@media(max-width:380px){.settings-shell{grid-template-columns:132px minmax(0,1fr)}.page{padding-left:12px;padding-right:12px}.brand{gap:5px}.brand-label{display:none}.sidebar-footer span{font-size:11px}}@media(prefers-reduced-motion:reduce){button{transition:none}}

      [dir=rtl] .sidebar{border-right:0;border-left:1px solid #414141}[dir=rtl] .nav-item{text-align:right}[dir=rtl] .chevron{margin-left:0;margin-right:auto}[dir=rtl] .nav-children{border-left:0;border-right:1px solid #444;margin-left:12px;margin-right:19px;padding-left:0;padding-right:18px}[dir=rtl] input[type=checkbox]{margin-right:0;margin-left:7px}.brand{flex-wrap:wrap}.brand>span{min-width:0}.nav-item span:not(.chevron){overflow-wrap:anywhere}.save-status{flex-shrink:1}.page-header>div{min-width:0}input[type=url],input[type=password],input[id^=shortcut-]{direction:ltr;text-align:left}
    </style>
  </head>
  <body data-title="Tubitle 设置"><div id="root"></div><script src="options.js"></script></body>
</html>
