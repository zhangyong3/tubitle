<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tubitle</title>
    <style>
      :root{font-family:Inter,system-ui,-apple-system,"PingFang SC",sans-serif;color:#f7f7fb;background:#12131a;color-scheme:dark}
      body{margin:0;min-width:320px}.app{padding:18px}.brand{font-size:20px;font-weight:750}.muted{color:#9ca0af;font-size:12px;line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}.toggle{width:46px;height:26px;border:0;border-radius:99px;background:#393c49;padding:3px;cursor:pointer}.toggle span{display:block;width:20px;height:20px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:#7c5cff}.toggle.on span{transform:translateX(20px)}select,button.primary{border:1px solid #343747;border-radius:10px;background:#1d1f29;color:#fff;padding:9px 10px}select{max-width:150px}button.primary{width:100%;cursor:pointer;background:#7c5cff;border-color:#7c5cff;font-weight:650}.status{padding:10px 12px;border-radius:10px;background:#1d1f29;font-size:12px;margin:12px 0}
    </style>
  </head>
  <body><div id="root"></div><script src="popup.js"></script></body>
</html>
